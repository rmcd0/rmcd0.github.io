# Builds the site and publishes it on GitHub Pages at every push on main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# Works for user sites (you.github.io), project sites (you.github.io/repo/) and custom domains:
# the address and path prefix come from GitHub, nothing to configure. See docs/deploy-github-pages.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - name: Check internal links
        run: npm run check:links
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
