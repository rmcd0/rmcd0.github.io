# Joran · nginx server block. Adapt server_name, root and the certificate paths.
server {
  listen 80;
  listen [::]:80;
  server_name example.com www.example.com;
  return 301 https://example.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name example.com;
  root /var/www/example.com;          # the content of _site/
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  charset utf-8;
  error_page 404 /404.html;
  types { application/manifest+json webmanifest; }

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json application/atom+xml image/svg+xml application/manifest+json;

  # /now -> /now/ -> /now/index.html
  location / {
    try_files $uri $uri/ =404;
  }

  # Versioned assets: one year
  location ~* \.(css|js|woff2|webp|avif|jpg|jpeg|png|gif|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
}
